[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upeep386"
version = "0.2.0"
description = "i386 NASM optimizer toolkit (peephole + asm-DCE + libc-split) for x86-32 compilers"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [
    {name = "upeep386 project"}
]
keywords = ["compiler", "optimization", "i386", "x86", "peephole", "nasm", "dos", "retro"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Code Generators",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.urls]
Homepage = "https://github.com/avwohl/upeep386"
Repository = "https://github.com/avwohl/upeep386"

[tool.setuptools.packages.find]
where = ["."]
include = ["upeep386*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
